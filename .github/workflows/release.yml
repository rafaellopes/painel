name: release

# Publish painel to PyPI via Trusted Publishing (OIDC) — no stored token.
# docs/SPEC.md §23.3. A release is a git tag `v*`; the workflow does the
# upload, not a human with a long-lived secret. `workflow_dispatch` is kept
# for a manual re-run. The filename (release.yml) and the environment name
# (pypi) are load-bearing: they are registered in PyPI's pending-publisher
# form for rafaellopes/painel — do not rename either side without the other.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC: mint a short-lived credential per run
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@v1.14.2
